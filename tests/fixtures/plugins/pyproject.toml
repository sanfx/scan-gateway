[project]
name = "scan-gateway-fake-plugin"
version = "0.0.1"
description = "Tiny installable package used only by scan-gateway's own test_discovery.py, to prove real entry-point discovery against an actually-installed distribution."
requires-python = ">=3.11"

[project.entry-points."scan_gateway.scanners"]
fake = "fake_scanner_plugin:FakeScanner"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fake_scanner_plugin"]
