[project]
name = "scan-gateway"
version = "0.2.0"
description = "Pluggable malware-scan orchestrator: tries configured scanner plugins, falls back to a built-in local heuristic check, decides accept/reject"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "sanfx" }]
dependencies = [
    "yara-python>=4.5",
]

[project.urls]
Homepage = "https://github.com/sanfx/scan-gateway"
Repository = "https://github.com/sanfx/scan-gateway"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
